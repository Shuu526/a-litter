<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一封信件</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f7fa;--card:#fff;--text:#20242b;--muted:#737985;--line:#e3e7ed;--accent:#557a9b;--paper:#fffdf7;--shadow:0 20px 60px rgba(30,45,65,.12)}
html,body{margin:0;min-height:100%;font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.back-btn{border:1px solid var(--line);background:rgba(255,255,255,.9);width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:var(--text);transition:.2s;margin-right:8px}.back-btn:hover{background:#eef2f6;transform:translateX(-2px)}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.brand{font-family:"Times New Roman","STSong",serif;font-size:21px;letter-spacing:2px;cursor:pointer}
.navlinks{display:flex;gap:8px}
.navlinks button,.ghost{border:0;background:transparent;padding:9px 14px;border-radius:9px;color:var(--text)}
.navlinks button:hover,.ghost:hover{background:#eef2f6}
.page{min-height:calc(100vh - 64px)}
.home{display:grid;place-items:center;padding:30px}
.hero{text-align:center}
.hero h1{font-family:"Times New Roman","STSong",serif;font-weight:400;font-size:clamp(48px,9vw,90px);letter-spacing:8px;margin:0 0 28px}
.hero p{color:var(--muted);margin-bottom:28px}
.primary{border:0;border-radius:12px;background:#273747;color:#fff;padding:14px 24px;box-shadow:0 10px 30px rgba(39,55,71,.18);transition:.2s}
.primary:hover{transform:translateY(-2px)}
.secondary{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 18px}
.auth-wrap{display:grid;place-items:center;padding:60px 20px}
.auth{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.auth h2{margin-top:0}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;border:0;background:none;padding:12px;color:var(--muted)}
.tabs .active{color:var(--text);border-bottom:2px solid #273747}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;outline:0}
.field input:focus{border-color:#9eb3c5}
.auth .primary{width:100%;margin-top:8px}
.editor-page{padding-bottom:40px}
.editor-top{max-width:1200px;margin:auto;padding:22px 22px 0;display:flex;justify-content:space-between;gap:14px;align-items:center}
.editor-top h2{margin:0;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{max-width:1200px;margin:14px auto 0;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:13px;display:flex;gap:6px;align-items:center;overflow-x:auto;box-shadow:0 8px 30px rgba(30,45,65,.05);position:sticky;top:74px;z-index:50}
.toolbar button,.toolbar select,.toolbar input[type=color]{height:34px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 8px;color:#333}
.toolbar button:hover{background:#f1f4f7}
.toolbar .sep{width:1px;height:24px;background:var(--line);flex:none}
.paper-editor-wrap{padding:28px 20px}
.paper-editor{width:min(860px,100%);min-height:1000px;margin:auto;background:var(--paper);box-shadow:var(--shadow);border:1px solid #ebe7dc;padding:72px clamp(28px,7vw,82px);position:relative}
.paper-title{width:100%;border:0;background:transparent;font:400 30px/1.4 "Times New Roman","STSong",serif;outline:0;margin-bottom:20px}
.editable{min-height:760px;outline:0;font-size:16px;line-height:1.9;word-break:break-word}
.editable img,.editable video{max-width:100%;height:auto;display:block;margin:16px auto;border-radius:6px}
.statusbar{max-width:860px;margin:12px auto 0;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.pagesbar{max-width:1200px;margin:20px auto 0;padding:0 20px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.pagechip{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;white-space:nowrap}
.pagechip.active{background:#273747;color:#fff}
.music-setting{max-width:860px;margin:18px auto;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.music-setting input{max-width:100%}
.reader{min-height:calc(100vh - 64px);position:relative;display:grid;place-items:center;padding:30px 16px;overflow:hidden}
.envelope-stage{width:min(620px,92vw);height:460px;position:relative;display:grid;place-items:center}
.envelope{width:min(440px,84vw);height:270px;position:relative;transform-style:preserve-3d;filter:drop-shadow(0 25px 35px rgba(20,30,40,.18));cursor:pointer;transition:transform .2s}
.envelope:hover{transform:translateY(-3px)}
.env-body{position:absolute;inset:0;background:linear-gradient(145deg,#e8edf2,#dbe2e9);border-radius:8px;z-index:3;overflow:hidden}
.env-body:before,.env-body:after{content:"";position:absolute;width:75%;height:2px;background:#c6cfd8;top:52%;left:12%;transform:rotate(28deg);opacity:.7}
.env-body:after{transform:rotate(-28deg)}
.env-paper{position:absolute;width:78%;height:220px;background:var(--paper);left:11%;bottom:20px;z-index:2;box-shadow:0 8px 18px rgba(0,0,0,.12);padding:28px;overflow:hidden;transition:transform .6s}
.env-paper .mini-content{font:14px/1.7 Georgia,"STSong",serif}
.env-flap{position:absolute;left:0;top:0;width:100%;height:55%;background:linear-gradient(145deg,#eef2f5,#d8e0e7);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:5;transition:transform .8s cubic-bezier(.2,.75,.25,1);backface-visibility:hidden}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.env-label{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Georgia,serif;font-size:18px;color:#68727d;pointer-events:none;transition:.3s}
.envelope.open .env-label{opacity:0}
.pull-hint{position:absolute;bottom:15px;color:var(--muted);font-size:14px;opacity:0;transition:.3s}
.reader.pull-mode .pull-hint{opacity:1}
.reader.pull-mode .env-paper{cursor:grab}
.reader.pull-mode .env-paper:active{cursor:grabbing}
.letter-view{position:absolute;inset:20px 16px 10px;display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(.96)}
.letter-view.show{opacity:1;pointer-events:auto;transform:none;transition:.65s cubic-bezier(.2,.8,.2,1)}
.stack{width:min(720px,92vw);height:min(78vh,760px);position:relative;touch-action:none}
.sheet{position:absolute;inset:0;background:var(--paper);border:1px solid #ebe7dc;box-shadow:0 22px 55px rgba(25,35,45,.18);padding:clamp(25px,5vw,60px);overflow:hidden;will-change:transform;transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .3s;touch-action:none;user-select:none}
.sheet .content{height:100%;overflow:hidden;word-break:break-word;font:16px/1.9 Arial,"Microsoft YaHei",sans-serif;user-select:text}
.sheet .content img,.sheet .content video{max-width:100%;height:auto;display:block;margin:12px auto}
.music-disc{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#202020 3px 4px,#090909 5px 7px);box-shadow:0 8px 25px rgba(0,0,0,.22);z-index:200;cursor:pointer;display:none;align-items:center;justify-content:center;touch-action:manipulation}
.music-disc:before{content:"";width:22px;height:22px;border-radius:50%;background:#b8a48a;border:4px solid #eee;box-shadow:0 0 0 2px #333}
.music-disc.playing{animation:spin 3s linear infinite}
.music-disc:active{transform:scale(.94)}
@keyframes spin{to{transform:rotate(360deg)}}
.sent-modal{position:fixed;inset:0;background:rgba(20,28,35,.42);display:grid;place-items:center;z-index:500}
.sent-card{background:#fff;border-radius:18px;padding:32px;width:min(400px,90vw);text-align:center;box-shadow:var(--shadow)}
.sent-card h2{font-family:Georgia,serif;font-weight:400}
.sent-link{background:#f4f6f8;padding:12px;border-radius:9px;word-break:break-all;text-align:left;font-size:13px;margin:18px 0}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#273747;color:#fff;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:700}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){
.nav{padding:0 14px;height:58px}.brand{font-size:18px}.navlinks button{padding:8px}
.editor-top{padding:16px;align-items:flex-start;flex-direction:column}
.toolbar{top:62px;border-radius:0;margin-top:10px;border-left:0;border-right:0}
.paper-editor{min-height:760px;padding:45px 24px}.editable{min-height:580px}
.envelope-stage{height:390px}.envelope{height:220px}.env-paper{height:180px}
.stack{height:min(78vh,650px)}
.reader-back{left:15px!important;top:72px!important}.music-disc{width:48px;height:48px;right:15px;bottom:15px}.music-disc:before{width:18px;height:18px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================
   数据与状态
========================= */
const KEY="letter_site_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"users":[],"letters":[]}');
let state={
 user:null, page:"home", authMode:"login", authError:"",
 pages:[{id:uid(),html:"<p>这是我的第一篇文章……</p>"}],
 pageIndex:0,title:"一封信",music:null,letterId:null
};
let savedRange=null;
let reader=null;

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast("存储空间不足，请减小图片、视频或音乐文件");return false}}
function toast(s){const el=document.getElementById("toast");el.textContent=s;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function encodeLetterForURL(letter){
  const json=JSON.stringify({
    id:letter.id,
    title:letter.title||"一封信",
    pages:letter.pages||[],
    music:letter.music||null
  });
  const bytes=new TextEncoder().encode(json);
  let bin="";
  for(const b of bytes) bin+=String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeLetterFromURL(payload){
  try{
    const b64=payload.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((payload.length+3)%4);
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null}
}
function getShareURL(letter){
  return location.href.split("#")[0].split("?")[0]+"?letter="+encodeURIComponent(encodeLetterForURL(letter));
}
function currentLetter(){return db.letters.find(x=>x.id===state.letterId)}
function requireLogin(){if(!state.user){state.page="auth";render();return false}return true}

/* =========================
   路由 / 导航
========================= */
function go(page){state.page=page;render()}
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(nav());
  const main=document.createElement("main");main.className="page";
  if(state.page==="home") main.innerHTML=homeHTML();
  if(state.page==="auth") main.innerHTML=authHTML();
  if(state.page==="editor") main.innerHTML=editorHTML();
  if(state.page==="manage") main.innerHTML=manageHTML();
  if(state.page==="reader") {main.className="page reader";main.innerHTML=readerHTML()}
  app.appendChild(main);
  bindCommon();
  if(state.page==="editor") bindEditor();
  if(state.page==="auth") bindAuth();
  if(state.page==="manage") bindManage();
  if(state.page==="reader") initReader();
}
function nav(){
 const n=document.createElement("header");n.className="nav";
 n.innerHTML=`<div class="brand" data-go="home">一封信件</div>
 <div class="navlinks">
   <button data-go="home">首页</button>
   ${state.user?`<button data-go="manage">我的信件</button><button id="logoutBtn">退出</button>`:`<button data-go="auth">登录</button>`}
 </div>`;
 return n;
}
function bindCommon(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 const out=document.getElementById("logoutBtn");if(out)out.onclick=()=>{state.user=null;go("home")}
}
function homeHTML(){
 return `<section class="home"><div class="hero">
 <h1>一封信件</h1><p>写下想说的话，让它以一封真正的信抵达。</p>
 <button class="primary" id="startBtn">开始编辑你的信件</button>
 </div></section>`;
}
function authHTML(){
 return `<section class="auth-wrap"><div class="auth"><button class="back-btn" id="authBack" title="返回上一页" aria-label="返回上一页">←</button>
 <div class="tabs"><button class="${state.authMode==="login"?"active":""}" id="loginTab">登录</button><button class="${state.authMode==="register"?"active":""}" id="regTab">注册</button></div>
 <h2>${state.authMode==="login"?"欢迎回来":"创建账号"}</h2>
 <div class="field"><label>用户名</label><input id="authUser" autocomplete="username"></div>
 <div class="field"><label>密码</label><input id="authPass" type="password" autocomplete="${state.authMode==="login"?"current-password":"new-password"}"></div>
 <div id="authError" style="color:#b04b4b;font-size:13px;min-height:20px">${esc(state.authError)}</div>
 <button class="primary" id="authSubmit">${state.authMode==="login"?"登录":"注册"}</button>
 </div></section>`;
}
function manageHTML(){
 const letters=db.letters.filter(x=>x.sender===state.user);
 return `<section style="max-width:1000px;margin:auto;padding:35px 20px">
 <button class="back-btn" id="manageBack" title="返回上一页" aria-label="返回上一页">←</button>
 <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>我的信件</h2><button class="primary" id="newLetter">新建信件</button></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px">
 ${letters.length?letters.map(l=>`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px">
 <h3>${esc(l.title||"无标题")}</h3><p style="color:var(--muted);font-size:13px">${new Date(l.updatedAt).toLocaleString()}</p>
 <button class="secondary editLetter" data-id="${l.id}">编辑</button>
 <button class="secondary readLetter" data-id="${l.id}">收件视角</button>
 </div>`).join(""):`<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:50px">还没有信件，开始写第一封吧。</div>`}
 </div></section>`;
}

/* =========================
   编辑器
========================= */
function editorHTML(){
 const p=state.pages[state.pageIndex]||state.pages[0];
 return `<section class="editor-page">
 <div class="editor-top"><div style="display:flex;align-items:center"><button class="back-btn" id="editorBack" title="返回上一页" aria-label="返回上一页">←</button><div><h2>编辑信件</h2><small style="color:var(--muted)">第 ${state.pageIndex+1} / ${state.pages.length} 页</small></div></div>
 <div class="actions">
 <button class="secondary" id="saveBtn">保存文章</button><button class="secondary" id="loadBtn">加载文章</button><button class="secondary" id="clearBtn">清空文章</button>
 <button class="primary" id="sendBtn">保存并寄出</button></div></div>
 <div class="toolbar" id="toolbar">
   <select id="fontSelect" title="字体"><option value="">字体</option>
   ${["Arial","Times New Roman","Microsoft YaHei","SimSun","SimHei","KaiTi","FangSong","Source Han Sans SC","Source Han Serif SC","LXGW WenKai"].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
   <select id="sizeSelect" title="字号"><option value="">字号</option>${[8,10,12,14,16,18,20,24,28,32,40].map(x=>`<option value="${x}">${x}px</option>`).join("")}</select>
   <span class="sep"></span>
   <button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button>
   <input id="foreColor" type="color" title="文字颜色" value="#20242b"><input id="backColor" type="color" title="文字背景颜色" value="#fff2a8">
   <span class="sep"></span>
   <button data-cmd="justifyLeft">左</button><button data-cmd="justifyCenter">中</button><button data-cmd="justifyRight">右</button>
   <button data-cmd="insertUnorderedList">• 列表</button><button data-cmd="insertOrderedList">1. 列表</button>
   <button id="linkBtn">链接</button><button id="imgBtn">图片</button><button id="gifBtn">GIF</button><button id="videoBtn">视频</button>
   <button data-cmd="undo">↶</button><button data-cmd="redo">↷</button>
   <input id="imgFile" type="file" accept="image/*" hidden><input id="gifFile" type="file" accept="image/gif" hidden><input id="videoFile" type="file" accept="video/mp4,video/*" hidden>
 </div>
 <div class="pagesbar"><button class="secondary" id="addPage">＋ 新增页面</button>${state.pages.map((_,i)=>`<button class="pagechip ${i===state.pageIndex?"active":""}" data-page="${i}">第 ${i+1} 页</button>`).join("")}<button class="secondary" id="delPage" ${state.pages.length<=1?"disabled":""}>删除当前页</button></div>
 <div class="paper-editor-wrap"><article class="paper-editor">
 <input id="paperTitle" class="paper-title" value="${esc(state.title)}" placeholder="信件标题">
 <div id="editable" class="editable" contenteditable="true" spellcheck="false">${p.html}</div>
 </article>
 <div class="statusbar"><span id="wordCount">字数：0</span><span>内容自动保存在当前编辑状态</span></div>
 <div class="music-setting"><b>背景音乐</b><div style="margin-top:9px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
 <input id="musicFile" type="file" accept=".mp3,audio/mpeg">
 <span id="musicName" style="color:var(--muted);font-size:13px">${state.music?esc(state.music.name):"未设置音乐"}</span>
 ${state.music?'<button class="secondary" id="removeMusic">删除音乐</button>':""}
 </div><small style="display:block;color:var(--muted);margin-top:7px">收件方只能播放 / 暂停，不能更换音乐。大文件可能超过 localStorage 容量。</small></div>
 </div>
 </section>`;
}
function saveSelection(){
 const sel=window.getSelection();if(!sel||!sel.rangeCount)return;
 const r=sel.getRangeAt(0);const ed=document.getElementById("editable");
 if(ed && ed.contains(r.commonAncestorContainer)) savedRange=r.cloneRange();
}
function restoreSelection(){
 const ed=document.getElementById("editable");if(!ed)return;
 ed.focus();
 if(savedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange)}
}
function exec(cmd,val=null){restoreSelection();document.execCommand(cmd,false,val);saveSelection();updateCount()}
function insertHTMLAtSelection(html){restoreSelection();document.execCommand("insertHTML",false,html);saveSelection();updateCount()}
function bindEditor(){
 const back=document.getElementById("editorBack"); if(back) back.onclick=()=>go("manage");
 const ed=document.getElementById("editable");
 const track=()=>{saveSelection();updateCount();state.pages[state.pageIndex].html=ed.innerHTML;state.title=document.getElementById("paperTitle").value};
 ["mouseup","keyup","input","touchend","blur"].forEach(e=>ed.addEventListener(e,track));
 document.getElementById("paperTitle").oninput=e=>state.title=e.target.value;
 document.querySelectorAll("[data-cmd]").forEach(b=>b.onmousedown=e=>e.preventDefault());
 document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>exec(b.dataset.cmd));
 document.getElementById("fontSelect").onmousedown=e=>{saveSelection()};
 document.getElementById("fontSelect").onchange=e=>{if(e.target.value)exec("fontName",e.target.value);e.target.value=""};
 document.getElementById("sizeSelect").onmousedown=e=>saveSelection();
 document.getElementById("sizeSelect").onchange=e=>{if(e.target.value)applyFontSize(e.target.value);e.target.value=""};
 document.getElementById("foreColor").onmousedown=e=>saveSelection();
 document.getElementById("foreColor").oninput=e=>exec("foreColor",e.target.value);
 document.getElementById("backColor").onmousedown=e=>saveSelection();
 document.getElementById("backColor").oninput=e=>exec("hiliteColor",e.target.value);
 document.getElementById("linkBtn").onmousedown=e=>e.preventDefault();
 document.getElementById("linkBtn").onclick=()=>{saveSelection();const u=prompt("输入链接地址：","https://");if(u)exec("createLink",u)};
 document.getElementById("imgBtn").onclick=()=>{saveSelection();document.getElementById("imgFile").click()};
 document.getElementById("gifBtn").onclick=()=>{saveSelection();document.getElementById("gifFile").click()};
 document.getElementById("videoBtn").onclick=()=>{saveSelection();document.getElementById("videoFile").click()};
 document.getElementById("imgFile").onchange=e=>fileToData(e.target.files[0],src=>insertHTMLAtSelection(`<img src="${src}" alt="图片">`));
 document.getElementById("gifFile").onchange=e=>fileToData(e.target.files[0],src=>insertHTMLAtSelection(`<img src="${src}" alt="GIF">`));
 document.getElementById("videoFile").onchange=e=>fileToData(e.target.files[0],src=>insertHTMLAtSelection(`<video controls playsinline src="${src}"></video>`));
 document.getElementById("addPage").onclick=()=>{saveCurrent();state.pages.splice(state.pageIndex+1,0,{id:uid(),html:"<p><br></p>"});state.pageIndex++;render()};
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{saveCurrent();state.pageIndex=+b.dataset.page;render()});
 document.getElementById("delPage").onclick=()=>{if(state.pages.length>1&&confirm("确定删除当前页吗？")){saveCurrent();state.pages.splice(state.pageIndex,1);state.pageIndex=Math.max(0,state.pageIndex-1);render()}};
 document.getElementById("saveBtn").onclick=saveLetter;
 document.getElementById("loadBtn").onclick=loadLetter;
 document.getElementById("clearBtn").onclick=clearLetter;
 document.getElementById("sendBtn").onclick=sendLetter;
 document.getElementById("musicFile").onchange=e=>fileToData(e.target.files[0],src=>{state.music={name:e.target.files[0].name,dataUrl:src};render()});
 const rm=document.getElementById("removeMusic");if(rm)rm.onclick=()=>{state.music=null;render()};
 updateCount();
}
function applyFontSize(px){
 restoreSelection();
 const sel=window.getSelection();
 if(!sel||!sel.rangeCount||sel.isCollapsed){toast("请先选择文字");return}
 const range=sel.getRangeAt(0);const span=document.createElement("span");span.style.fontSize=px+"px";
 try{span.appendChild(range.extractContents());range.insertNode(span);range.selectNodeContents(span);sel.removeAllRanges();sel.addRange(range);savedRange=range.cloneRange()}catch(e){document.execCommand("fontSize",false,"7");document.querySelectorAll('font[size="7"]').forEach(x=>x.style.fontSize=px+"px")}
 updateCount();
}
function fileToData(file,cb){
 if(!file)return;
 const r=new FileReader();r.onload=()=>cb(r.result);r.onerror=()=>toast("文件读取失败");r.readAsDataURL(file);
}
function updateCount(){
 const ed=document.getElementById("editable");if(!ed)return;
 document.getElementById("wordCount").textContent="字数："+ed.innerText.replace(/\s/g,"").length;
}
function saveCurrent(){
 const ed=document.getElementById("editable");
 if(ed){state.pages[state.pageIndex].html=ed.innerHTML;state.title=document.getElementById("paperTitle").value}
}
function saveLetter(){
 if(!requireLogin())return;saveCurrent();
 let l=currentLetter();
 if(!l){l={id:uid(),sender:state.user,recipient:"",title:state.title,pages:state.pages,music:state.music,createdAt:Date.now(),updatedAt:Date.now(),sent:false};db.letters.push(l);state.letterId=l.id}
 else Object.assign(l,{title:state.title,pages:state.pages,music:state.music,updatedAt:Date.now()});
 saveDB();toast("文章已保存");
}
function loadLetter(){
 const ls=db.letters.filter(x=>x.sender===state.user);
 if(!ls.length){toast("还没有保存过的文章");return}
 const l=ls[0];state.letterId=l.id;state.title=l.title||"一封信";state.pages=l.pages||[{id:uid(),html:"<p><br></p>"}];state.music=l.music||null;state.pageIndex=0;render();toast("已加载最近保存的文章");
}
function clearLetter(){
 if(confirm("确定要清空当前文章吗？此操作可能无法恢复。")){
  state.pages=[{id:uid(),html:"<p><br></p>"}];state.pageIndex=0;state.title="一封信";render();
 }
}
function sendLetter(){
 if(!requireLogin())return;saveCurrent();
 if(!state.letterId){saveLetter()}
 const l=currentLetter();if(!l)return;
 l.title=state.title;l.pages=state.pages;l.music=state.music;l.updatedAt=Date.now();l.sent=true;saveDB();
 playSendAnimation(l);
}

/* =========================
   登录 / 管理
========================= */
function bindAuth(){
 const back=document.getElementById("authBack"); if(back) back.onclick=()=>go("home");
 document.getElementById("loginTab").onclick=()=>{state.authMode="login";state.authError="";render()};
 document.getElementById("regTab").onclick=()=>{state.authMode="register";state.authError="";render()};
 document.getElementById("authSubmit").onclick=()=>{
  const u=document.getElementById("authUser").value.trim(),p=document.getElementById("authPass").value;
  if(!u||!p){state.authError="请填写用户名和密码";render();return}
  if(state.authMode==="register"){
   if(db.users.some(x=>x.username===u)){state.authError="用户名已存在";render();return}
   db.users.push({username:u,password:p});saveDB();state.user=u;state.authError="";go("manage");
  }else{
   const x=db.users.find(x=>x.username===u&&x.password===p);
   if(!x){state.authError="用户名或密码错误";render();return}
   state.user=u;go("manage");
  }
 };
}
function bindManage(){
 const back=document.getElementById("manageBack"); if(back) back.onclick=()=>go("home");
 document.getElementById("newLetter").onclick=()=>{state.letterId=null;state.pages=[{id:uid(),html:"<p>你好，</p><p>这是我的一封信……</p>"}];state.pageIndex=0;state.title="一封信";state.music=null;go("editor")};
 document.querySelectorAll(".editLetter").forEach(b=>b.onclick=()=>openLetter(b.dataset.id));
 document.querySelectorAll(".readLetter").forEach(b=>b.onclick=()=>{state.letterId=b.dataset.id;go("reader")});
}
function openLetter(id){
 const l=db.letters.find(x=>x.id===id);if(!l)return;
 state.letterId=id;state.title=l.title||"一封信";state.pages=l.pages||[];state.music=l.music||null;state.pageIndex=0;go("editor");
}

/* =========================
   寄信动画
========================= */
function sendOverlay(){
 const o=document.createElement("div");o.id="sendOverlay";o.style.cssText="position:fixed;inset:0;background:#eef1f4;z-index:600;overflow:hidden;display:grid;place-items:center";
 o.innerHTML=`<div id="sendScene" style="position:relative;width:100%;height:100%;perspective:1200px">
 <div id="sendPaper" style="position:absolute;width:min(520px,75vw);height:min(680px,78vh);left:50%;top:50%;transform:translate(-50%,-50%);background:#fffdf7;border:1px solid #ebe7dc;box-shadow:0 25px 70px rgba(20,30,40,.2);padding:50px;overflow:hidden;transform-origin:center">
 <div style="font:16px/1.9 Georgia,serif">${state.pages.map(p=>p.html).join("<hr style='border:0;border-top:1px solid #eee;margin:35px 0'>")}</div></div>
 <div id="foldLeft" style="display:none"></div><div id="foldRight" style="display:none"></div>
 <div id="sendEnv" style="position:absolute;width:min(430px,80vw);height:260px;left:50%;top:75%;transform:translate(-50%,100%);opacity:0;transition:transform .8s,opacity .8s;filter:drop-shadow(0 20px 35px rgba(20,30,40,.2))">
  <div style="position:absolute;inset:0;background:#dfe6ed;border-radius:8px;z-index:3"></div>
  <div id="inserted" style="position:absolute;width:75%;height:190px;left:12.5%;top:-30px;background:#fffdf7;z-index:2;box-shadow:0 5px 15px rgba(0,0,0,.15);transition:transform 1s"></div>
  <div id="envFlap" style="position:absolute;left:0;top:0;width:100%;height:58%;background:#edf1f5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform:rotateX(0);z-index:5;transition:transform .8s cubic-bezier(.2,.8,.2,1);backface-visibility:hidden"></div>
 </div></div>`;
 document.body.appendChild(o);return o;
}
async function delay(ms){return new Promise(r=>setTimeout(r,ms))}
async function playSendAnimation(l){
 const o=sendOverlay(),p=o.querySelector("#sendPaper"),env=o.querySelector("#sendEnv"),ins=o.querySelector("#inserted"),flap=o.querySelector("#envFlap");
 await delay(300);
 p.style.transition="transform 1.1s cubic-bezier(.2,.8,.2,1)";p.style.transform="translate(-50%,-50%) scale(.43)";
 await delay(1200);
 p.style.transition="transform .9s cubic-bezier(.25,.7,.25,1)";p.style.transform="translate(-50%,-50%) scale(.43) rotateY(70deg)";
 await delay(500);
 p.style.transform="translate(-50%,-50%) scale(.43) rotateY(180deg)";
 await delay(800);
 env.style.opacity="1";env.style.transform="translate(-50%,-35%)";
 await delay(900);
 p.style.transition="transform 1s cubic-bezier(.2,.75,.2,1)";p.style.transform="translate(-50%,95%) scale(.43) rotateY(180deg)";
 await delay(900);
 p.style.opacity="0";p.style.transition="opacity .2s";
 ins.style.transform="translateY(70px)";
 await delay(850);
 flap.style.transform="rotateX(-180deg)";
 await delay(900);
 o.innerHTML=`<div class="sent-modal" style="position:absolute"><div class="sent-card"><h2>信件已寄出</h2><p style="color:#737985">你的信已经准备好被打开。</p><div class="sent-link">${esc(getShareURL(l))}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="secondary" id="closeSent">关闭</button><button class="primary" id="againSent">再写一封</button><button class="secondary" id="copyLink">复制收信链接</button><button class="secondary" id="openReader">打开收件方视角</button></div></div></div>`;
 document.getElementById("copyLink").onclick=async()=>{try{await navigator.clipboard.writeText(getShareURL(l));toast("收信链接已复制")}catch(e){prompt("请复制这个收信链接：",getShareURL(l))}};
 document.getElementById("closeSent").onclick=()=>{o.remove();go("manage")};
 document.getElementById("againSent").onclick=()=>{o.remove();state.letterId=null;state.pages=[{id:uid(),html:"<p><br></p>"}];state.title="一封信";state.music=null;state.pageIndex=0;go("editor")};
 document.getElementById("openReader").onclick=()=>{o.remove();go("reader")};
}

/* =========================
   收件页面
========================= */
function readerHTML(){
 const l=reader;
 if(!l)return `<div style="text-align:center">找不到这封信。</div>`;
 return `<button class="back-btn reader-back" id="readerBack" title="返回上一页" aria-label="返回上一页" style="position:fixed;left:22px;top:84px;z-index:210">←</button><div class="envelope-stage" id="readerStage">
 <div class="envelope" id="envelope">
   <div class="env-paper" id="pullPaper"><div class="mini-content">${l.pages?.[0]?.html||"<p>这是一封信。</p>"}</div></div>
   <div class="env-body"></div><div class="env-flap"></div><div class="env-label">一封信</div>
 </div>
 <div class="pull-hint">按住露出的信纸，向上拖动</div>
 </div>
 <div class="letter-view" id="letterView"><div class="stack" id="stack"></div></div>
 ${l.music?`<div class="music-disc" id="musicDisc" title="播放 / 暂停"></div><audio id="bgAudio" src="${l.music.dataUrl}" preload="metadata"></audio>`:""}`;
}
function initReader(){
 const readerBack=document.getElementById("readerBack"); if(readerBack) readerBack.onclick=()=>{if(state.user) go("manage"); else go("home")};
 const params=new URLSearchParams(location.search);const id=params.get("letter");
 if(id){const l=db.letters.find(x=>x.id===id);if(l)reader=l}
 if(!reader)reader=currentLetter();
 const env=document.getElementById("envelope");if(!env)return;
 let opened=false,dragging=false,startY=0,startX=0,baseY=0;
 env.addEventListener("click",e=>{if(dragging)return;if(!opened){opened=true;env.classList.add("open");document.querySelector(".reader").classList.add("pull-mode")}});
 const paper=document.getElementById("pullPaper");
 paper.addEventListener("pointerdown",e=>{
  if(!opened)return;e.preventDefault();dragging=true;startY=e.clientY;startX=e.clientX;baseY=0;paper.setPointerCapture(e.pointerId);paper.style.transition="none";
 });
 paper.addEventListener("pointermove",e=>{
  if(!dragging)return;e.preventDefault();const dy=Math.min(0,e.clientY-startY);baseY=Math.max(-180,dy);paper.style.transform=`translateY(${baseY}px) rotate(${Math.max(-2,Math.min(2,(e.clientX-startX)/30))}deg)`;
 });
 paper.addEventListener("pointerup",e=>{
  if(!dragging)return;dragging=false;paper.releasePointerCapture(e.pointerId);paper.style.transition="transform .45s cubic-bezier(.2,.8,.2,1)";
  if(baseY<-95){paper.style.transform="translateY(-260px) scale(.96)";setTimeout(showFullLetter,450)}
  else paper.style.transform="translateY(0) rotate(0)";
 });
 paper.addEventListener("pointercancel",()=>{dragging=false;paper.style.transition="transform .45s";paper.style.transform="translateY(0)"});
 const disc=document.getElementById("musicDisc"),audio=document.getElementById("bgAudio");
 if(disc&&audio){
  disc.style.display="flex";
  disc.onclick=async()=>{try{if(audio.paused){await audio.play();disc.classList.add("playing")}else{audio.pause();disc.classList.remove("playing")}}catch(e){toast("浏览器需要先允许音频播放")}};
 }
}
function showFullLetter(){
 document.getElementById("readerStage").style.opacity="0";document.getElementById("readerStage").style.transition=".45s";
 const view=document.getElementById("letterView");view.classList.add("show");buildStack();
}
function buildStack(){
 const stack=document.getElementById("stack");stack.innerHTML="";
 const pages=reader.pages||[];const current=0;
 pages.forEach((p,i)=>{
  const s=document.createElement("div");s.className="sheet";s.dataset.index=i;s.style.zIndex=pages.length-i;
  s.style.transform=`translate(${i*7}px,${i*8}px) rotate(${i*.35}deg) scale(${1-i*.012})`;
  s.innerHTML=`<div class="content">${p.html}</div>`;stack.appendChild(s);
 });
 setupSwipe();
}
let swipeCleanup=null;
function setupSwipe(){
 const stack=document.getElementById("stack");if(!stack)return;
 const sheets=[...stack.querySelectorAll(".sheet")];let current=0,down=false,startX=0,dx=0;
 function arrange(){
  sheets.forEach((s,i)=>{const rel=(i-current+sheetCount())%sheetCount();s.style.zIndex=100-rel;s.style.transition="transform .5s cubic-bezier(.2,.8,.2,1)";if(rel===0)s.style.transform=`translate(0,0) rotate(0deg) scale(1)`;else if(rel<4)s.style.transform=`translate(${rel*7}px,${rel*8}px) rotate(${rel*.35}deg) scale(${1-rel*.012})`;else s.style.transform=`translate(${rel*7}px,${rel*8}px) rotate(${rel*.35}deg) scale(.94)`;});
 }
 function sheetCount(){return sheets.length}
 function onDown(e){const top=sheets[current];if(!top)return;down=true;startX=e.clientX;dx=0;top.style.transition="none";top.setPointerCapture?.(e.pointerId)}
 function onMove(e){if(!down)return;e.preventDefault();dx=e.clientX-startX;const top=sheets[current];top.style.transform=`translateX(${dx}px) rotate(${dx/45}deg)`;top.style.boxShadow=`${-dx/12}px 24px 60px rgba(25,35,45,.22)`}
 function onUp(e){if(!down)return;down=false;const top=sheets[current];const threshold=Math.max(90,stack.clientWidth*.28);if(Math.abs(dx)>=threshold && ((dx<0&&current<sheets.length-1)||(dx>0&&current>0))){
   const dir=dx<0?-1:1;top.style.transition="transform .55s cubic-bezier(.2,.8,.2,1)";top.style.transform=`translateX(${dir*(stack.clientWidth+180)}px) rotate(${dir*12}deg)`;const old=current;current+=dx<0?1:-1;
   setTimeout(()=>{top.style.transition="none";arrange()},560);
 }else{top.style.transition="transform .45s cubic-bezier(.2,.8,.2,1)";arrange()}dx=0}
 stack.addEventListener("pointerdown",onDown);stack.addEventListener("pointermove",onMove);stack.addEventListener("pointerup",onUp);stack.addEventListener("pointercancel",onUp);
 arrange();
}

/* =========================
   URL reader bootstrap
========================= */
(function(){
 const payload=new URLSearchParams(location.search).get("letter");
 if(payload){
   reader=decodeLetterFromURL(payload);
   if(reader)state.page="reader";
 }
 render();
 if(state.page==="home"){
   const b=document.getElementById("startBtn");
   if(b)b.onclick=()=>{if(requireLogin()){state.letterId=null;state.pages=[{id:uid(),html:"<p>你好，</p><p>这是我的一封信……</p>"}];state.pageIndex=0;state.title="一封信";state.music=null;go("editor")}}
 }
})();
</script>
